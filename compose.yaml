name: ai-cybersecurity-copilot

services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=dev
      - DATABASE_PATH=/data/copilot.sqlite3
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_BASE=https://api.groq.com/openai/v1
      - GROQ_MODEL=llama-3.1-8b-instant
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_MINUTES=480
      - DEMO_ANALYST_PASSWORD=${DEMO_ANALYST_PASSWORD}
      - DEMO_SENIOR_PASSWORD=${DEMO_SENIOR_PASSWORD}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      - backend_data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  backend_data:
