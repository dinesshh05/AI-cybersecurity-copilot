name: ai-cybersecurity-copilot

services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=dev
      - DATABASE_PATH=/data/copilot.sqlite3
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    volumes:
      - ./backend:/app
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  web:
    build:
      context: ./web
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  backend_data:
  ollama_data:

